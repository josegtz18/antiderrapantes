<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | Calcetines TP</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

        <h1>Calcetines Antiderrapantes TP</h1>

    <nav>

        <a href="index.html">Inicio</a>

        <a href="nosotros.html">Nosotros</a>

    </nav>

</header>

<section class="contacto-page">

    <h2>Contacto</h2>

    <p>
        Escríbenos para cotizaciones o pedidos.
    </p>

    <form class="contact-form"
    action="https://formspree.io/f/mnjwezqq"
    method="POST"
    enctype="text/plain">

        <input type="text"
        name="nombre"
        placeholder="Tu nombre"
        required>

        <input type="email"
        name="email"
        placeholder="Tu correo"
        required>

        <textarea
        name="mensaje"
        rows="5"
        placeholder="Escribe tu mensaje..."
        required></textarea>

        <button type="submit">

            Enviar mensaje

        </button>

    </form>

</section>

</body>
</html>
